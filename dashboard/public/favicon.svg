<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Driftless">
  <defs>
    <linearGradient id="dl-g" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D7FFF"/>
      <stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
  </defs>
  <!-- Page -->
  <path fill="url(#dl-g)" d="M14 6c0-2.2 1.8-4 4-4h24l12 12v38c0 2.2-1.8 4-4 4H18c-2.2 0-4-1.8-4-4V6z"/>
