name = "driftless"
account_id = "9a7e1fdf0f95dbdb5064685a88152d86"
workers_dev = true
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]


# Custom domain (Workers)
[[routes]]
pattern = "driftless.sahinur.dev"
custom_domain = true



[[d1_databases]]
binding = "DB"
database_name = "driftless"
database_id = "aec0ea6e-5d91-4ced-b8a2-778025d3adcc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "driftless-docs"

[[queues.producers]]
binding = "JOBS"
queue = "driftless-jobs"

[[queues.consumers]]
queue = "driftless-jobs"
max_batch_size = 10
max_batch_timeout = 5

# Optional semantic search — uncomment after creating the index:
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "driftless-embeddings"
#
# [ai]
# binding = "AI"

[vars]
APP_NAME = "Driftless"

# Secrets (wrangler secret put): GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
# SESSION_SECRET, WEBHOOK_SECRET, APP_BASE_URL

[assets]
directory = "./dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker handles /api, /mcp, /oauth, /webhook, /share first; falls through to assets.
run_worker_first = true
